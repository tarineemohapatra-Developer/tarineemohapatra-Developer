<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="'Arial Black', Arial, sans-serif">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
