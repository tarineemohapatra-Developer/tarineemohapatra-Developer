<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Arial Black', Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000" stroke-width="1" opacity="0.18"/>
    </pattern>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="2.5" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#FF5A36"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- ===== scattered icons ===== -->

  <!-- top-left: warning triangle -->
  <g transform="translate(70,70)">
    <path d="M30 0 L60 55 L0 55 Z" fill="#111" />
    <text x="24" y="46" font-size="26" fill="#FF5A36" font-weight="900">!</text>
  </g>

  <!-- globe icon top right -->
  <g transform="translate(1080,60)">
    <circle cx="30" cy="30" r="30" fill="#111"/>
    <circle cx="30" cy="30" r="30" fill="none" stroke="#FF5A36" stroke-width="2"/>
    <ellipse cx="30" cy="30" rx="12" ry="30" fill="none" stroke="#FF5A36" stroke-width="2"/>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#FF5A36" stroke-width="2"/>
  </g>

  <!-- browser window (design) top right-mid -->
  <g transform="translate(950,150)">
    <rect width="140" height="100" rx="6" fill="#1155CC" stroke="#111" stroke-width="4"/>
    <rect width="140" height="26" rx="6" fill="#fff" stroke="#111" stroke-width="4"/>
    <circle cx="16" cy="13" r="4" fill="#111"/>
    <circle cx="30" cy="13" r="4" fill="#111"/>
    <circle cx="44" cy="13" r="4" fill="#111"/>
    <line x1="20" y1="55" x2="120" y2="55" stroke="#fff" stroke-width="6"/>
    <line x1="20" y1="75" x2="90" y2="75" stroke="#fff" stroke-width="6"/>
  </g>

  <!-- diamond gem shape -->
  <g transform="translate(430,60)">
    <path d="M20 0 L40 18 L20 55 L0 18 Z" fill="#FFD93D" stroke="#111" stroke-width="3"/>
    <path d="M20 0 L40 18 L0 18 Z" fill="#fff" opacity="0.4"/>
  </g>

  <!-- cursor arrow bottom right -->
  <g transform="translate(1075,470)">
    <path d="M0 0 L30 10 L16 16 L26 32 L18 36 L8 20 L0 30 Z" fill="#111"/>
  </g>

  <!-- lock / lock badge bottom left -->
  <g transform="translate(70,470)">
    <rect width="150" height="46" rx="23" fill="#111"/>
    <text x="18" y="30" font-size="20" fill="#FFD93D" font-weight="900">**** •</text>
    <rect x="118" y="8" width="30" height="30" rx="6" fill="#FFD93D"/>
    <path d="M126 22 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#111" stroke-width="3"/>
    <rect x="124" y="22" width="16" height="12" rx="2" fill="#111"/>
  </g>

  <!-- small crossed X window bottom -->
  <g transform="translate(280,520)">
    <rect width="80" height="60" rx="6" fill="#111"/>
    <rect width="80" height="16" rx="6" fill="#FFD93D"/>
    <line x1="20" y1="32" x2="60" y2="52" stroke="#FFD93D" stroke-width="5"/>
    <line x1="60" y1="32" x2="20" y2="52" stroke="#FFD93D" stroke-width="5"/>
  </g>

  <!-- small dead-face badge -->
  <g transform="translate(870,470)">
    <rect width="60" height="60" rx="14" fill="#FFD93D" stroke="#111" stroke-width="3"/>
    <line x1="16" y1="22" x2="26" y2="32" stroke="#111" stroke-width="4"/>
    <line x1="26" y1="22" x2="16" y2="32" stroke="#111" stroke-width="4"/>
    <line x1="34" y1="22" x2="44" y2="32" stroke="#111" stroke-width="4"/>
    <line x1="44" y1="22" x2="34" y2="32" stroke="#111" stroke-width="4"/>
    <path d="M18 44 q12 -10 24 0" stroke="#111" stroke-width="4" fill="none"/>
  </g>

  <!-- decorative dashes -->
  <line x1="240" y1="90" x2="270" y2="90" stroke="#111" stroke-width="6"/>
  <line x1="930" y1="420" x2="960" y2="420" stroke="#111" stroke-width="6"/>
  <circle cx="770" cy="90" r="5" fill="#111"/>
  <circle cx="150" cy="300" r="5" fill="#111"/>
  <circle cx="1050" cy="300" r="5" fill="#111"/>

  <!-- ===== CENTER: terminal ===== -->
  <g transform="translate(430,190)">
    <!-- monitor stand -->
    <rect x="130" y="240" width="80" height="20" fill="#111"/>
    <polygon points="150,190 190,190 210,240 130,240" fill="#111"/>

    <!-- monitor body -->
    <rect x="0" y="0" width="340" height="250" rx="18" fill="#1155CC" stroke="#111" stroke-width="6"/>
    <rect x="18" y="18" width="304" height="185" rx="8" fill="#0A0F1E" stroke="#111" stroke-width="4"/>

    <!-- screen text -->
    <text x="40" y="70" font-size="20" fill="#5FD0FF" font-family="'Courier New', monospace" font-weight="700">&lt;</text>
    <text x="40" y="105" font-size="26" fill="#fff" font-family="'Courier New', monospace" font-weight="900">I'M AN</text>
    <text x="40" y="140" font-size="26" fill="#FFD93D" font-family="'Courier New', monospace" font-weight="900">ENGINEER</text>
    <text x="40" y="175" font-size="26" fill="#FF8A65" font-family="'Courier New', monospace" font-weight="900">+ DESIGNER</text>
    <text x="270" y="175" font-size="24" fill="#5FD0FF" font-family="'Courier New', monospace">_</text>

    <!-- base buttons -->
    <circle cx="170" cy="228" r="6" fill="#fff"/>
  </g>

  <!-- name + tagline -->
  <text x="600" y="560" font-size="42" font-weight="900" fill="#111" text-anchor="middle" letter-spacing="2">TARINEE PRASAD MOHAPATRA</text>
  <line x1="380" y1="580" x2="480" y2="580" stroke="#111" stroke-width="3"/>
  <text x="600" y="600" font-size="18" font-weight="700" fill="#111" text-anchor="middle" letter-spacing="4">SOFTWARE ENGINEER  —  PRODUCT DESIGNER</text>
  <line x1="720" y1="580" x2="820" y2="580" stroke="#111" stroke-width="3"/>

</svg>